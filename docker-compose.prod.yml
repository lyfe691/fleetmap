# Production FleetMap stack: Caddy (TLS) -> Next app -> OSRM (internal),
# deployed beside the self-hosted Supabase stack on the same host.
#
# The three FleetMap images are built by GitHub Actions (.github/workflows/images.yml)
# and pulled from ghcr.io; the server never builds. `./redeploy.sh` pulls + restarts.
# Reads .env in this directory for the runtime env. Build the OSRM dataset once
# before the first `up` (see docs/deployment.md).

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  caddy:
    image: caddy:2
    <<: *logging
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # the directory, not the file: a single-file bind mount pins an inode, and
      # git pull replaces the file, so the container keeps serving stale config
      - ./caddy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      FLEET_HOST: ${FLEET_HOST}
      FLEET_HOST_ALIASES: ${FLEET_HOST_ALIASES:-}
      SUPABASE_HOST: ${SUPABASE_HOST}
      SUPABASE_HOST_ALIASES: ${SUPABASE_HOST_ALIASES:-}
    depends_on:
      - app
    networks:
      - default
      - fleetmap-edge

  app:
    image: ghcr.io/lyfe691/fleetmap-app:latest
    <<: *logging
    restart: unless-stopped
    env_file: .env       # server-only secrets read at runtime (DASHBOARD_*, DISPATCHER_*, OSRM_URL)
    environment:
      OSRM_URL: http://osrm:5000   # reach OSRM by service name inside the stack
      DRIVER_SESSION_URL: http://driver-session:3100
    extra_hosts:
      - "${SUPABASE_HOST}:host-gateway"   # own Supabase via own Caddy, whatever public DNS says
    expose:
      - "3000"           # internal only — Caddy is the public edge
    depends_on:
      - osrm

  sync:
    image: ghcr.io/lyfe691/fleetmap-sync:latest
    <<: *logging
    restart: unless-stopped
    env_file: .env       # BB_* + DISPATCHER_INGEST_SECRET + NEXT_PUBLIC_SUPABASE_*
    environment:
      FLEETMAP_API_URL: http://app:3000   # reach the app by service name
    extra_hosts:
      - "${SUPABASE_HOST}:host-gateway"
    depends_on:
      - app

  driver-session:
    image: ghcr.io/lyfe691/fleetmap-driver-session:latest
    <<: *logging
    restart: unless-stopped
    # Deliberately NOT env_file: .env — this service is the only sanctioned
    # holder of the Supabase secret key outside scripts/, and its secrets live
    # in a separate file so they never enter the app container's environment.
    env_file: .env.driver-session
    environment:
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
    extra_hosts:
      - "${SUPABASE_HOST}:host-gateway"
    expose:
      - "3100"

  osrm:
    image: osrm/osrm-backend@sha256:af5d4a83fb90086a43b1ae2ca22872e6768766ad5fcbb07a29ff90ec644ee409
    command: osrm-routed --algorithm mld /data/switzerland-latest.osrm
    <<: *logging
    volumes:
      - ./osrm:/data
    expose:
      - "5000"           # internal only — never exposed publicly
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:

networks:
  fleetmap-edge:
    external: true
