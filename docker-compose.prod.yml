# Production FleetMap stack: Caddy (TLS) -> Next app -> OSRM (internal),
# deployed beside the self-hosted Supabase stack on the same VPS.
#
# Build the three FleetMap images locally, ship/load their release archive, then:
#   docker compose -f docker-compose.prod.yml up -d --no-build
#
# The build blocks remain as local metadata; production consumes the explicit
# image tags below and never builds on the VPS. Reads .env in this directory for
# build args (NEXT_PUBLIC_*) and runtime env. Build the OSRM dataset once before
# first `up` (see docs/deployment.md).

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # the directory, not the file: a single-file bind mount pins an inode, and
      # git pull replaces the file, so the container keeps serving stale config
      - ./caddy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    networks:
      - default
      - fleetmap-edge

  app:
    image: fleetmap-app:latest
    build:
      context: .
      args:
        # NEXT_PUBLIC_* must be present at build time (inlined into the client bundle).
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
    restart: unless-stopped
    env_file: .env       # server-only secrets read at runtime (DASHBOARD_*, DISPATCHER_*, OSRM_URL)
    environment:
      OSRM_URL: http://osrm:5000   # reach OSRM by service name inside the stack
      DRIVER_SESSION_URL: http://driver-session:3100
    expose:
      - "3000"           # internal only — Caddy is the public edge
    depends_on:
      - osrm

  sync:
    image: fleetmap-sync:latest
    build:
      context: .
      target: sync
    restart: unless-stopped
    env_file: .env       # BB_* + DISPATCHER_INGEST_SECRET + NEXT_PUBLIC_SUPABASE_*
    environment:
      FLEETMAP_API_URL: http://app:3000   # reach the app by service name
    depends_on:
      - app

  driver-session:
    image: fleetmap-driver-session:latest
    build:
      context: .
      target: driver-session
    restart: unless-stopped
    # Deliberately NOT env_file: .env — this service is the only sanctioned
    # holder of the Supabase secret key outside scripts/, and its secrets live
    # in a separate file so they never enter the app container's environment.
    env_file: .env.driver-session
    environment:
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
    expose:
      - "3100"

  osrm:
    image: osrm/osrm-backend@sha256:af5d4a83fb90086a43b1ae2ca22872e6768766ad5fcbb07a29ff90ec644ee409
    command: osrm-routed --algorithm mld /data/switzerland-latest.osrm
    volumes:
      - ./osrm:/data
    expose:
      - "5000"           # internal only — never exposed publicly
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:

networks:
  fleetmap-edge:
    external: true
